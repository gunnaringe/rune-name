                <stop offset="0.82" stop-color="#fff"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <mask id="fade" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="190">
                <rect width="400" height="190" fill="url(#fade-grad)"/>
            </mask>
            <clipPath id="sail-clip"><path d="M146 44 L234 44 Q242 80 233 112 L147 112 Q138 80 146 44 Z"/></clipPath>
        </defs>
        <circle class="sun" cx="335" cy="42" r="22"/>
        <path class="gull" d="M60 40 q6 -6 12 0 q6 -6 12 0"/>
        <path class="gull" d="M95 26 q4 -4 8 0 q4 -4 8 0"/>
        <g mask="url(#fade)"><g class="wave wave-back">
            <path d="M-80 158 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V190 H-80 Z"/>
        </g></g>
        <g class="ship">

                <path d="M112 140 L92 170"/><path d="M146 142 L126 172"/><path d="M180 143 L160 173"/>

                <rect class="sail-b" x="148" y="40" width="14" height="80"/>

                <rect class="sail-b" x="204" y="40" width="14" height="80"/>
                <rect class="sail-b" x="232" y="40" width="14" height="80"/>

            <g class="viking" transform="translate(250 134) scale(1.35) translate(-245 -134)">

            <circle class="eye" cx="352" cy="77" r="1.3"/>
            <g class="shields">
                <circle cx="104" cy="132" r="10"/><circle cx="130" cy="133" r="10" class="alt"/>
                <circle cx="156" cy="134" r="10"/><circle cx="182" cy="134" r="10" class="alt"/>

            <g class="bosses">

                <circle cx="260" cy="134" r="2.5"/><circle cx="286" cy="133" r="2.5"/>
            </g>

        <g mask="url(#fade)"><g class="wave wave-front">
            <path d="M-80 170 q20 -9 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 V190 H-80 Z"/>

    <p class="tagline" data-i18n="tagline"></p>

    <div class="card input-card">
        <label for="input-text" data-i18n="inputLabel">Navnet ditt</label>
        <input id="input-text" type="text" name="input" autocomplete="off" spellcheck="false"
               data-i18n-placeholder="placeholder" placeholder="Skriv inn navnet ditt her…">
    </div>

    <div class="notice" id="doubles-notice" role="status" hidden>
        <span class="notice-rune" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v18M8 8.5l8 6"/></svg></span>
        <p>
            <span data-i18n="doublesNotice"></span>
            <a href="settings.html#doubles" data-i18n="doublesNoticeLink"></a>
        </p>
        <button class="icon-btn small" type="button" id="doubles-dismiss" data-i18n-aria="dismiss">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
    </div>

    <section class="results">
        <article class="card result">
            <header>
                <div>
                    <h2 data-i18n="longBranch"></h2>
                    <p class="note" data-i18n="longBranchNote"></p>
                </div>
                <button class="share" type="button" data-target="long-branch"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share"></span></button>
            </header>
            <p class="runes" id="long-branch" lang="und-Runr"></p>
        </article>

        <article class="card result">
            <header>
                <div>
                    <h2 data-i18n="shortTwig"></h2>
                    <p class="note" data-i18n="shortTwigNote"></p>
                </div>
                <button class="share" type="button" data-target="short-twig"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span data-i18n="share"></span></button>
            </header>
            <p class="runes" id="short-twig" lang="und-Runr"></p>
        </article>

        <article class="card result">
            <header>
                <div>
                    <h2 data-i18n="elderFuthark"></h2>

            </header>
            <p class="runes" id="elder-futhark" lang="und-Runr"></p>
        </article>
    </section>
</main>
